version: '3.8'

services:
  backend:
    build: .
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=medicare_pro
      - DB_USER=root
      - DB_PASS=rootpassword
      - JWT_SECRET=your_super_secret_key_here
      - JWT_EXPIRES_IN=8h
      - JWT_REFRESH_SECRET=your_refresh_secret_here
      - JWT_REFRESH_EXPIRES_IN=7d
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: medicare_pro
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
